services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: commerceiq
      POSTGRES_PASSWORD: commerceiq
      POSTGRES_DB: commerceiq
    ports:
      - "5432:5432"
    volumes:
      - commerceiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://commerceiq:commerceiq@db:5432/commerceiq
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  commerceiq_pgdata:
